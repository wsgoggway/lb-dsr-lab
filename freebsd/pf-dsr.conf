# lb-dsr-lab DSR ruleset (FreeBSD 14.x legacy pf syntax: no match/rdr-to
# keywords). SHARED by the whole CARP pair: both lb1 and lb2 run this exact
# file so a failover never changes filtering behavior.
#
# Rules are deliberately SINGLE-LINE: a trailing space after a line
# continuation backslash breaks pf.conf with a bare "syntax error".
#
# DSR forwarding: pf only sees the client half of each TCP flow - backends
# answer the client directly with src=VIP - hence keep state (sloppy): the
# firewall never sees the return half of the flow (documented for exactly
# this asymmetric routing case).
#
# The DSR rule itself is NO LONGER STATIC: it is rendered by the pfkeeper
# control plane into the pfkeeper/<service> anchors from the git state
# (services/web.yaml sets the mode, tables/webs.yaml the member weights).
# Round-robin, weighted probability chains, sticky mode and health-driven
# re-renders are all applied by pfkeeper (`pfctl -a pfkeeper/<name> -f`)
# WITHOUT touching this file - that is why only the anchor attachment point
# lives here. Until pfkeeper starts after a fresh boot the anchor is empty;
# the pfkeeper control-plane pass rules below are outside the anchor, so
# management access never depends on anchor content.
# The table is `persist` and intentionally NOT `const`: pfkeeper (and
# tests/t04) change members at runtime via `pfctl -t webs -T delete/add`.
# persist is MANDATORY since the DSR rule moved into the pfkeeper anchor:
# with no main-ruleset rule referencing <webs>, pfctl -f would neither
# create nor keep the table at all (non-persist tables unused by the main
# ruleset are dropped), breaking round-robin mode and pfkeeper reconcile.
# FreeBSD's pf keeps the OLD grammar: route-to stands right after `on <if>`
# (with its pool options), NOT at the end of the rule like OpenBSD >= 4.7,
# and `keep state (...)` must be the LAST element of the rule. Anything else
# is a bare "syntax error" on FreeBSD 14.
set skip on lo0
table <webs> persist { 192.168.100.21, 192.168.100.22 }

# DSR rule is rendered by pfkeeper from the git state into pfkeeper/*:
# mode (round-robin / weighted) and weights change without editing pf.conf.
anchor "pfkeeper/*"

# CARP/pfsync control plane: CARP adverts (proto carp, multicast 224.0.0.18)
# arrive on vtnet0, pfsync state replication (proto pfsync) flows over vtnet1.
# (no-sync) keeps these control-plane states out of pfsync replication itself.
pass in quick proto carp keep state (no-sync)
pass in quick proto pfsync keep state (no-sync)

# lab management traffic (both balancers)
pass in quick proto icmp
pass in quick proto tcp to 192.168.100.11 port 22
pass in quick proto tcp to 192.168.100.12 port 22

# pfkeeper control plane: client gRPC 8443, peer gRPC 8444, metrics 9100.
# Peer gRPC (8444) is only reachable over the isolated net-sync /30 (vtnet1).
# Client gRPC and metrics are also served from the lab management subnet
# (192.168.100.0/24 on vtnet0) - mTLS is the access control, pf limits scope.
# Exporters ride the same vtnet0 rule: node_exporter :9101 (the prometheus
# convention port 9100 is taken by pfkeeper metrics) and pf_exporter :9102.
pass in quick on vtnet1 proto tcp from 10.0.100.0/30 to (vtnet1) port { 8443, 8444, 9100 } keep state
pass in quick on vtnet0 proto tcp from 192.168.100.0/24 to (vtnet0) port { 8443, 9100, 9101, 9102 } keep state

pass out quick keep state
