# lb1 NAT comparison ruleset (FreeBSD 14.x legacy pf syntax).
#
# NAT mode is the symmetric counterpart to DSR: rdr rewrites dst VIP -> backend
# and pf stays on the return path, so it sees both halves of every flow (see
# tests/t06-nat-compare.sh). scripts/pf-mode.sh adds host routes on rs1/rs2 so
# backend replies transit lb1 - rdr translation only applies when the return
# path goes back through this firewall.
set skip on lo0
table <webs> { 192.168.100.21, 192.168.100.22 }

# NAT mode: symmetric path, replies return through lb1
rdr pass on vtnet0 proto tcp to (vtnet0) port 80 -> <webs> round-robin sticky-address

pass in quick proto icmp
pass in quick proto tcp to (vtnet0) port 22
pass out quick keep state
