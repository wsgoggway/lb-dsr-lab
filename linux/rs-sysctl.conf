# DSR realserver tuning (installed as /etc/sysctl.d/70-dsr.conf by cloud-init).
#
# arp_ignore/arp_announce: hide the VIP on lo from ARP so ONLY lb1 answers for
# 192.168.100.200 - otherwise the backends would steal the VIP at L2 and DSR
# would collapse into plain L2 switching.
# rp_filter=0: the reverse path is asymmetric by design in DSR (replies never
# come back the way requests arrived), strict rp_filter would drop them.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.lo.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.lo.arp_announce = 2
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.lo.rp_filter = 0
# ICMP redirects would teach the backends to bypass lb1 for lab sources,
# which breaks the NAT comparison mode (tests/t06, scripts/pf-mode.sh).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
