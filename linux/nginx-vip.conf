# DSR realserver vhost. `listen 80` (wildcard) serves BOTH balancing modes:
# in DSR packets arrive with dst=VIP (on lo), in the NAT comparison mode rdr
# rewrites dst to the backend's own address (.21/.22).
server {
    listen 80;
    server_name _;

    # Marked by lb tests to see which backend served each request.
    add_header X-Served-By $hostname always;

    location = /healthz {
        # default_type instead of add_header: a location-level add_header
        # would drop the inherited X-Served-By header.
        default_type text/plain;
        return 200 "ok $hostname\n";
    }

    location / {
        root /srv/www;
    }
}
