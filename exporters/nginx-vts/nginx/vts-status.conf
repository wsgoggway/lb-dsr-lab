# VTS status endpoint scraped locally by nginx-vts-exporter. Distinct
# server_name keeps status scrapes out of the wildcard zone "*".
server {
    listen 8081;
    server_name vts-status;
    access_log /var/log/nginx/vts-status-access.log;

    location /status {
        vhost_traffic_status_display;
        vhost_traffic_status_display_format json;
        allow 127.0.0.1;
        allow 192.168.100.0/24;
        deny all;
    }
}
