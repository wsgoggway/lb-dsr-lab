# nginx-module-vts: shared status zone plus filter zones (by Host, by response code).
vhost_traffic_status_zone;

# Per-Host filter zone (VIP host 192.168.100.200 arrives via DSR).
vhost_traffic_status_filter_by_set_key $http_host host::*;

# Per-response-code filter zone.
vhost_traffic_status_filter_by_set_key $status code::*;
